<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-turbine-role-permission-heading" jhiTranslate="desgloseApp.turbineRolePermission.home.createOrEditLabel">Create or edit a Turbine Role Permission</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!turbineRolePermission.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="turbineRolePermission.id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineRolePermission.role" for="field_role">Role</label>
                    <select class="form-control" id="field_role" name="role" [(ngModel)]="turbineRolePermission.roleId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="turbineRoleOption.id" *ngFor="let turbineRoleOption of roles; trackBy: trackTurbineRoleById">{{turbineRoleOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineRolePermission.permission" for="field_permission">Permission</label>
                    <select class="form-control" id="field_permission" name="permission" [(ngModel)]="turbineRolePermission.permissionId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="turbinePermissionOption.id" *ngFor="let turbinePermissionOption of permissions; trackBy: trackTurbinePermissionById">{{turbinePermissionOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
