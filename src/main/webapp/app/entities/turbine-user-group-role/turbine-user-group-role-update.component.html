<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-turbine-user-group-role-heading" jhiTranslate="desgloseApp.turbineUserGroupRole.home.createOrEditLabel">Create or edit a Turbine User Group Role</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!turbineUserGroupRole.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="turbineUserGroupRole.id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineUserGroupRole.user" for="field_user">User</label>
                    <select class="form-control" id="field_user" name="user" [(ngModel)]="turbineUserGroupRole.userId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="turbineUserOption.id" *ngFor="let turbineUserOption of users; trackBy: trackTurbineUserById">{{turbineUserOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineUserGroupRole.group" for="field_group">Group</label>
                    <select class="form-control" id="field_group" name="group" [(ngModel)]="turbineUserGroupRole.groupId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="turbineGroupOption.id" *ngFor="let turbineGroupOption of groups; trackBy: trackTurbineGroupById">{{turbineGroupOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineUserGroupRole.role" for="field_role">Role</label>
                    <select class="form-control" id="field_role" name="role" [(ngModel)]="turbineUserGroupRole.roleId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="turbineRoleOption.id" *ngFor="let turbineRoleOption of roles; trackBy: trackTurbineRoleById">{{turbineRoleOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
