<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-turbine-role-heading" jhiTranslate="desgloseApp.turbineRole.home.createOrEditLabel">Create or edit a Turbine Role</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!turbineRole.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="turbineRole.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineRole.roleId" for="field_roleId">Role Id</label>
                    <input type="number" class="form-control" name="roleId" id="field_roleId"
                        [(ngModel)]="turbineRole.roleId" required/>
                    <div [hidden]="!(editForm.controls.roleId?.dirty && editForm.controls.roleId?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.roleId?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.roleId?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineRole.roleName" for="field_roleName">Role Name</label>
                    <input type="text" class="form-control" name="roleName" id="field_roleName"
                        [(ngModel)]="turbineRole.roleName" required/>
                    <div [hidden]="!(editForm.controls.roleName?.dirty && editForm.controls.roleName?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.roleName?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineRole.objectdata" for="field_objectdata">Objectdata</label>
                    <div>
                        <div *ngIf="turbineRole.objectdata" class="form-text text-danger clearfix">
                            <a class="pull-left" (click)="openFile(turbineRole.objectdataContentType, turbineRole.objectdata)" jhiTranslate="entity.action.open">open</a><br>
                            <span class="pull-left">{{turbineRole.objectdataContentType}}, {{byteSize(turbineRole.objectdata)}}</span>
                            <button type="button" (click)="turbineRole.objectdata=null;turbineRole.objectdataContentType=null;"
                                    class="btn btn-secondary btn-xs pull-right">
                                <fa-icon [icon]="'times'"></fa-icon>
                            </button>
                        </div>
                        <input type="file" id="file_objectdata" (change)="setFileData($event, turbineRole, 'objectdata', false)" jhiTranslate="entity.action.addblob"/>
                    </div>
                    <input type="hidden" class="form-control" name="objectdata" id="field_objectdata"
                        [(ngModel)]="turbineRole.objectdata" />
                    <input type="hidden" class="form-control" name="objectdataContentType" id="field_objectdataContentType"
                        [(ngModel)]="turbineRole.objectdataContentType" />
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
