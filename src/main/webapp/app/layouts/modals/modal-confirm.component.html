<div class="modal-header">
    <h4 class="modal-title"><span jhiTranslate="info.title"></span></h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            (click)="closeModalConfirm()">&times;
    </button>
</div>
<div class="modal-body">
    <jhi-alert></jhi-alert>
    <jhi-alert-error></jhi-alert-error>
    <div class="row justify-content-center">
        <div class="col-12">
            <form role="form">
                <div class="form-row">
                    <p><strong jhiTranslate="info.sessionWillBeClosed" [translateValues]="translateValues" class="text-primary"></strong></p>
                </div>
                <div class="form-group row">
                    <div class="col-sm-8"></div>
                    <div class="col-sm-2">
                        <button class="btn btn-default btn-block btn-custom-font-size-1" (click)="onClickEmitCancelAction()">
                            <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="global.form.no"></span>
                        </button>
                    </div>
                    <div class="col-sm-2">
                        <button class="btn btn-primary btn-block btn-custom-font-size-1" (click)="onClickEmitOkAction()">
                            <fa-icon [icon]="'check'"></fa-icon>&nbsp;<span jhiTranslate="global.form.yes"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
