<div class="container justify-content-center">
    <div class="col-sm-12">
        <div class="card">
            <jhi-alert-error></jhi-alert-error>
            <div class="card-header hand-pointer" (click)="isCollapsedDataPanel = !isCollapsedDataPanel" [attr.aria-expanded]="!isCollapsedDataPanel"
                 aria-controls="collapseDataPanel">
                <div class="row">
                    <span class="col-sm-11" jhiTranslate="clientupdate.actualizacion"></span>
                    <span class="col-sm-1">
                        <fa-icon class="float-sm-right fa-sm" [icon]="isCollapsedDataPanel ? ICON_CARD_OPEN : ICON_CARD_CLOSE"></fa-icon>
                    </span>
                </div>
            </div>
            <div class="card-body" [ngbCollapse]="isCollapsedDataPanel" id="collapseDataPanel">
                <form [formGroup]="forma" (ngSubmit)="grabarDatos()" novalidate="" class="form-inline">
                    <div class="row">
                        <div class="form-group col-md-6">
                            <label class="col-sm-4 col-form-label col-form-label-sm" jhiTranslate="clientupdate.nombre" for="field_nombre"></label>
                            <input type="text" class="form-control form-control-sm col-sm-8" formControlName="nombre" id="field_nombre" maxlength="40"/>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="col-sm-4 col-form-label col-form-label-sm" jhiTranslate="clientupdate.apellidoPaterno" for="field_apellidoPaterno"></label>
                            <input type="text" class="form-control form-control-sm col-sm-8" formControlName="apellidoPaterno" id="field_apellidoPaterno" maxlength="20"/>
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group col-md-6">
                            <label class="col-sm-4 col-form-label col-form-label-sm" jhiTranslate="clientupdate.apellidoMaterno" for="field_apellidoMaterno"></label>
                            <input type="text" class="form-control form-control-sm col-sm-8" formControlName="apellidoMaterno" id="field_apellidoMaterno" maxlength="20"/>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="col-sm-4 col-form-label col-form-label-sm" jhiTranslate="clientupdate.actividadEconomica" for="field_actividadEconomica"></label>
                            <select class="form-control form-control-sm col-sm-8" id="field_actividadEconomica" formControlName="actividadEconomica">
                                <option [ngValue]='0' jhiTranslate="clientupdate.seleccioneActividad"></option>
                                <option *ngFor="let item of listaActividades" [ngValue]="item.codGenerico"> {{item.glsGenericalarga }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-8"></div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-default btn-block btn-sm" (click)="previousState()">
                                <fa-icon [icon]="'ban'"></fa-icon>
                                <span jhiTranslate="global.form.cancel"></span>
                            </button>
                        </div>
                        <div class="col-sm-2">
                            <button type="submit" class="btn btn-primary btn-block btn-sm">
                                <fa-icon [icon]="'save'"></fa-icon>
                                <span jhiTranslate="clientupdate.guardar"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
