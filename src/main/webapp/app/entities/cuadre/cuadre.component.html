<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.cuadre.home.title">Cuadres</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-cuadre" [routerLink]="['/cuadre/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span jhiTranslate="desgloseApp.cuadre.home.createLabel">
            Create new Cuadre
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="cuadres">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
                <th jhiSortBy="codTpoConcep1"><span jhiTranslate="desgloseApp.cuadre.codTpoConcep1">Cod Tpo Concep 1</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="corConcepto1"><span jhiTranslate="desgloseApp.cuadre.corConcepto1">Cor Concepto 1</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="codTpoConcep2"><span jhiTranslate="desgloseApp.cuadre.codTpoConcep2">Cod Tpo Concep 2</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="corConcepto2"><span jhiTranslate="desgloseApp.cuadre.corConcepto2">Cor Concepto 2</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="glsMensaje"><span jhiTranslate="desgloseApp.cuadre.glsMensaje">Gls Mensaje</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let cuadre of cuadres ;trackBy: trackId">
                <td><a [routerLink]="['/cuadre', cuadre.codTpoConcep1,  cuadre.corConcepto1, cuadre.codTpoConcep2, cuadre.corConcepto2, 'view' ]">{{cuadre.codTpoConcep1}}</a></td>
                <td>{{cuadre.corConcepto1}}</td>
                <td>{{cuadre.codTpoConcep2}}</td>
                <td>{{cuadre.corConcepto2}}</td>
                <td>{{cuadre.glsMensaje}}</td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit" [routerLink]="['/cuadre', cuadre.codTpoConcep1,  cuadre.corConcepto1, cuadre.codTpoConcep2, cuadre.corConcepto2, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit" [routerLink]="['/cuadre', cuadre.codTpoConcep1,  cuadre.corConcepto1, cuadre.codTpoConcep2, cuadre.corConcepto2, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'cuadre/' + cuadre.codTpoConcep1 + '/' + cuadre.corConcepto1 + '/' + cuadre.codTpoConcep2 + '/' +
                                    cuadre.corConcepto2 + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="cuadres && cuadres.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true"
                            (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
