<div class="modal-header">
    <h4 class="modal-title"><span jhiTranslate="breakdown.selectAuditor.title"></span></h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            (click)="closeModal()">&times;
    </button>
</div>
<div class="modal-body">
    <jhi-alert></jhi-alert>
    <jhi-alert-error></jhi-alert-error>
    <div class="row justify-content-center">
        <div class="col-12">
            <form name="auditorDataForm" role="form" novalidate #auditorDataForm="ngForm" id="auditorDataForm">
                <div class="form-group row">
                    <label for="field_auditor" class="col-sm-4 col-form-label" jhiTranslate="breakdown.selectAuditor.auditor"></label>
                    <div class="col-sm-8">
                        <select class="form-control form-control-sm" id="field_auditor" name="auditor" [(ngModel)]="breakdownAuditor.auditor" required
                                [compareWith]="compareFn"
                                (change)="onSelectAuditorChange()" ngbAutofocus>
                            <option [ngValue]="el" *ngFor="let el of (simpleComboBoxTypes | filterDescripcionCodigo:CODTABLA_AUDITORES)">{{el.glsGenericalarga }}</option>
                        </select>
                        <div [hidden]="!(auditorDataForm.controls.auditor?.dirty && auditorDataForm.controls.auditor?.invalid)">
                            <small class="form-text text-danger" [hidden]="!auditorDataForm.controls.auditor?.errors?.required" jhiTranslate="entity.validation.required"></small>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="field_otherAuditorName" class="col-sm-4 col-form-label" jhiTranslate="breakdown.selectAuditor.otherAuditorName"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control form-control-sm" name="otherAuditorName" id="field_otherAuditorName" [(ngModel)]="breakdownAuditor.otherAuditorName"
                               #fieldOtherAuditorName [pattern]="NAME_VALIDATION_PATTERN" [disabled]="isOtherAuditorNameDisabled" [required]="!isOtherAuditorNameDisabled"/>
                        <div [hidden]="!(auditorDataForm.controls.otherAuditorName?.dirty && auditorDataForm.controls.otherAuditorName?.invalid)">
                            <small class="form-text text-danger" [hidden]="!auditorDataForm.controls.otherAuditorName?.errors?.pattern"
                                   jhiTranslate="entity.validation.patternname"></small>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-sm-6"></div>
                    <div class="col-sm-3">
                        <button class="btn btn-default btn-block btn-custom-font-size-1" (click)="onClickCancel()">
                            <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="global.form.cancel"></span>
                        </button>
                    </div>
                    <div class="col-sm-3">
                        <button class="btn btn-primary btn-block btn-custom-font-size-1" (click)="triggerOnSelectItemEvent()" [disabled]="auditorDataForm.form.invalid">
                            <fa-icon [icon]="'check'"></fa-icon>&nbsp;<span jhiTranslate="global.form.accept"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
