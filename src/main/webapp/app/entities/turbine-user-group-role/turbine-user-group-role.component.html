<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.turbineUserGroupRole.home.title">Turbine User Group Roles</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-turbine-user-group-role" [routerLink]="['/turbine-user-group-role/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="desgloseApp.turbineUserGroupRole.home.createLabel">
            Create new Turbine User Group Role
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="turbineUserGroupRoles">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="userId"><span jhiTranslate="desgloseApp.turbineUserGroupRole.user">User</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="groupId"><span jhiTranslate="desgloseApp.turbineUserGroupRole.group">Group</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="roleId"><span jhiTranslate="desgloseApp.turbineUserGroupRole.role">Role</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let turbineUserGroupRole of turbineUserGroupRoles ;trackBy: trackId">
                <td><a [routerLink]="['/turbine-user-group-role', turbineUserGroupRole.id, 'view' ]">{{turbineUserGroupRole.id}}</a></td>
                <td>
                    <div *ngIf="turbineUserGroupRole.userId">
                        <a [routerLink]="['../turbine-user', turbineUserGroupRole.userId , 'view' ]" >{{turbineUserGroupRole.userId}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="turbineUserGroupRole.groupId">
                        <a [routerLink]="['../turbine-group', turbineUserGroupRole.groupId , 'view' ]" >{{turbineUserGroupRole.groupId}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="turbineUserGroupRole.roleId">
                        <a [routerLink]="['../turbine-role', turbineUserGroupRole.roleId , 'view' ]" >{{turbineUserGroupRole.roleId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/turbine-user-group-role', turbineUserGroupRole.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/turbine-user-group-role', turbineUserGroupRole.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'turbine-user-group-role/'+ turbineUserGroupRole.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="turbineUserGroupRoles && turbineUserGroupRoles.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
