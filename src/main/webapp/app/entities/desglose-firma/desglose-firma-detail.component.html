<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="desgloseFirma">
            <h2><span jhiTranslate="desgloseApp.desgloseFirma.detail.title">Desglose Firma</span> {{desgloseFirma.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="desgloseApp.desgloseFirma.codCargo" [ngbTooltip]="'desgloseApp.desgloseFirma.help.codCargo' | translate">Cod Cargo</span></dt>
                <dd>
                    <span>{{desgloseFirma.codCargo}}</span>
                </dd>
                <dt><span jhiTranslate="desgloseApp.desgloseFirma.numRolEmpleado" [ngbTooltip]="'desgloseApp.desgloseFirma.help.numRolEmpleado' | translate">Num Rol Empleado</span></dt>
                <dd>
                    <span>{{desgloseFirma.numRolEmpleado}}</span>
                </dd>
                <dt><span jhiTranslate="desgloseApp.desgloseFirma.numRolEmpleado2fir" [ngbTooltip]="'desgloseApp.desgloseFirma.help.numRolEmpleado2fir' | translate">Num Rol Empleado 2 Fir</span></dt>
                <dd>
                    <span>{{desgloseFirma.numRolEmpleado2fir}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/desglose-firma', desgloseFirma.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
