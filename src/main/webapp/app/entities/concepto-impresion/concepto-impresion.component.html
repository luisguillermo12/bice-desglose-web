<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.conceptoImpresion.home.title">Concepto Impresions</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-concepto-impresion" [routerLink]="['/concepto-impresion/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span jhiTranslate="desgloseApp.conceptoImpresion.home.createLabel">
            Create new Concepto Impresion
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="conceptoImpresions">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
                <th jhiSortBy="codCliente"><span jhiTranslate="desgloseApp.conceptoImpresion.codCliente">Cod Cliente</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="codTipoDes"><span jhiTranslate="desgloseApp.conceptoImpresion.codTipoDes">Cod Tipo Des</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="codSubtipoDes"><span jhiTranslate="desgloseApp.conceptoImpresion.codSubtipoDes">Cod Subtipo Des</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="codMoneda"><span jhiTranslate="desgloseApp.conceptoImpresion.codMoneda">Cod Moneda</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="codTipoConcep"><span jhiTranslate="desgloseApp.conceptoImpresion.codTipoConcep">Cod Tipo Concep</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="corConcepto"><span jhiTranslate="desgloseApp.conceptoImpresion.corConcepto">Cor Concepto</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let item of conceptoImpresions ;trackBy: trackId">
                <td>{{item.codCliente}}</td>
                <td>{{item.codTipoDes}}</td>
                <td>{{item.codSubtipoDes}}</td>
                <td>{{item.codMoneda}}</td>
                <td>{{item.codTipoConcep}}</td>
                <td>{{item.corConcepto}}</td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/concepto-impresion', item.codCliente, item.codTipoDes, item.codSubtipoDes, item.codMoneda, item.codTipoConcep, item.corConcepto, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/concepto-impresion', item.codCliente, item.codTipoDes, item.codSubtipoDes, item.codMoneda, item.codTipoConcep, item.corConcepto, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'concepto-impresion/'+ item.codCliente + '/' + item.codTipoDes + '/' + item.codSubtipoDes + '/' +
                                item.codMoneda + '/' + item.codTipoConcep + '/' + item.corConcepto + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="conceptoImpresions && conceptoImpresions.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true"
                            (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
