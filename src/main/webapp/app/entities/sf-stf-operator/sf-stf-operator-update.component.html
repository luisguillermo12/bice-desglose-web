<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-sf-stf-operator-heading" jhiTranslate="desgloseApp.sfStfOperator.home.createOrEditLabel">Create or edit a Sf Stf Operator</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!sfStfOperator.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="sfStfOperator.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.sfStfOperator.branchCode" for="field_branchCode" [ngbTooltip]="'desgloseApp.sfStfOperator.help.branchCode' | translate">Branch Code</label>
                    <input type="number" class="form-control" name="branchCode" id="field_branchCode"
                        [(ngModel)]="sfStfOperator.branchCode" required/>
                    <div [hidden]="!(editForm.controls.branchCode?.dirty && editForm.controls.branchCode?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.branchCode?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.branchCode?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.sfStfOperator.operatorCode" for="field_operatorCode" [ngbTooltip]="'desgloseApp.sfStfOperator.help.operatorCode' | translate">Operator Code</label>
                    <input type="number" class="form-control" name="operatorCode" id="field_operatorCode"
                        [(ngModel)]="sfStfOperator.operatorCode" required/>
                    <div [hidden]="!(editForm.controls.operatorCode?.dirty && editForm.controls.operatorCode?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.operatorCode?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.operatorCode?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.sfStfOperator.loginName" for="field_loginName" [ngbTooltip]="'desgloseApp.sfStfOperator.help.loginName' | translate">Login Name</label>
                    <input type="text" class="form-control" name="loginName" id="field_loginName"
                        [(ngModel)]="sfStfOperator.loginName" />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.sfStfOperator.isSupervisor" for="field_isSupervisor" [ngbTooltip]="'desgloseApp.sfStfOperator.help.isSupervisor' | translate">Is Supervisor</label>
                    <input type="number" class="form-control" name="isSupervisor" id="field_isSupervisor"
                        [(ngModel)]="sfStfOperator.isSupervisor" />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.sfStfOperator.signedOn" for="field_signedOn" [ngbTooltip]="'desgloseApp.sfStfOperator.help.signedOn' | translate">Signed On</label>
                    <input type="number" class="form-control" name="signedOn" id="field_signedOn"
                        [(ngModel)]="sfStfOperator.signedOn" />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.sfStfOperator.dayOpen" for="field_dayOpen" [ngbTooltip]="'desgloseApp.sfStfOperator.help.dayOpen' | translate">Day Open</label>
                    <input type="number" class="form-control" name="dayOpen" id="field_dayOpen"
                        [(ngModel)]="sfStfOperator.dayOpen" />
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
