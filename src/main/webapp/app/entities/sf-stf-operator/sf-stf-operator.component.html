<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.sfStfOperator.home.title">Sf Stf Operators</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-sf-stf-operator" [routerLink]="['/sf-stf-operator/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="desgloseApp.sfStfOperator.home.createLabel">
            Create new Sf Stf Operator
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="sfStfOperators">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="branchCode"><span jhiTranslate="desgloseApp.sfStfOperator.branchCode">Branch Code</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="operatorCode"><span jhiTranslate="desgloseApp.sfStfOperator.operatorCode">Operator Code</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="loginName"><span jhiTranslate="desgloseApp.sfStfOperator.loginName">Login Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="isSupervisor"><span jhiTranslate="desgloseApp.sfStfOperator.isSupervisor">Is Supervisor</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="signedOn"><span jhiTranslate="desgloseApp.sfStfOperator.signedOn">Signed On</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="dayOpen"><span jhiTranslate="desgloseApp.sfStfOperator.dayOpen">Day Open</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let sfStfOperator of sfStfOperators ;trackBy: trackId">
                <td><a [routerLink]="['/sf-stf-operator', sfStfOperator.id, 'view' ]">{{sfStfOperator.id}}</a></td>
                <td>{{sfStfOperator.branchCode}}</td>
                <td>{{sfStfOperator.operatorCode}}</td>
                <td>{{sfStfOperator.loginName}}</td>
                <td>{{sfStfOperator.isSupervisor}}</td>
                <td>{{sfStfOperator.signedOn}}</td>
                <td>{{sfStfOperator.dayOpen}}</td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/sf-stf-operator', sfStfOperator.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sf-stf-operator', sfStfOperator.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'sf-stf-operator/'+ sfStfOperator.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="sfStfOperators && sfStfOperators.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
