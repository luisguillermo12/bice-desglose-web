<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-turbine-group-heading" jhiTranslate="desgloseApp.turbineGroup.home.createOrEditLabel">Create or edit a Turbine Group</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!turbineGroup.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="turbineGroup.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineGroup.groupId" for="field_groupId">Group Id</label>
                    <input type="number" class="form-control" name="groupId" id="field_groupId"
                        [(ngModel)]="turbineGroup.groupId" required/>
                    <div [hidden]="!(editForm.controls.groupId?.dirty && editForm.controls.groupId?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.groupId?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.groupId?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineGroup.groupName" for="field_groupName">Group Name</label>
                    <input type="text" class="form-control" name="groupName" id="field_groupName"
                        [(ngModel)]="turbineGroup.groupName" required/>
                    <div [hidden]="!(editForm.controls.groupName?.dirty && editForm.controls.groupName?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.groupName?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.turbineGroup.objectdata" for="field_objectdata">Objectdata</label>
                    <div>
                        <div *ngIf="turbineGroup.objectdata" class="form-text text-danger clearfix">
                            <a class="pull-left" (click)="openFile(turbineGroup.objectdataContentType, turbineGroup.objectdata)" jhiTranslate="entity.action.open">open</a><br>
                            <span class="pull-left">{{turbineGroup.objectdataContentType}}, {{byteSize(turbineGroup.objectdata)}}</span>
                            <button type="button" (click)="turbineGroup.objectdata=null;turbineGroup.objectdataContentType=null;"
                                    class="btn btn-secondary btn-xs pull-right">
                                <fa-icon [icon]="'times'"></fa-icon>
                            </button>
                        </div>
                        <input type="file" id="file_objectdata" (change)="setFileData($event, turbineGroup, 'objectdata', false)" jhiTranslate="entity.action.addblob"/>
                    </div>
                    <input type="hidden" class="form-control" name="objectdata" id="field_objectdata"
                        [(ngModel)]="turbineGroup.objectdata" />
                    <input type="hidden" class="form-control" name="objectdataContentType" id="field_objectdataContentType"
                        [(ngModel)]="turbineGroup.objectdataContentType" />
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
