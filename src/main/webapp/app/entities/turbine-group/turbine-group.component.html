<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.turbineGroup.home.title">Turbine Groups</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-turbine-group" [routerLink]="['/turbine-group/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="desgloseApp.turbineGroup.home.createLabel">
            Create new Turbine Group
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="turbineGroups">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="groupId"><span jhiTranslate="desgloseApp.turbineGroup.groupId">Group Id</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="groupName"><span jhiTranslate="desgloseApp.turbineGroup.groupName">Group Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="objectdata"><span jhiTranslate="desgloseApp.turbineGroup.objectdata">Objectdata</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let turbineGroup of turbineGroups ;trackBy: trackId">
                <td><a [routerLink]="['/turbine-group', turbineGroup.id, 'view' ]">{{turbineGroup.id}}</a></td>
                <td>{{turbineGroup.groupId}}</td>
                <td>{{turbineGroup.groupName}}</td>
                <td>
                    <a *ngIf="turbineGroup.objectdata" (click)="openFile(turbineGroup.objectdataContentType, turbineGroup.objectdata)" jhiTranslate="entity.action.open">open</a>
                    <span *ngIf="turbineGroup.objectdata">{{turbineGroup.objectdataContentType}}, {{byteSize(turbineGroup.objectdata)}}</span>
                </td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/turbine-group', turbineGroup.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/turbine-group', turbineGroup.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'turbine-group/'+ turbineGroup.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="turbineGroups && turbineGroups.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
