<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-desglose-mensaje-heading" jhiTranslate="desgloseApp.desgloseMensaje.home.createOrEditLabel">Create or edit a Desglose Mensaje</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!desgloseMensaje.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="desgloseMensaje.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.fecEvent" for="field_fecEvent" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.fecEvent' | translate">Fec Event</label>
                    <div class="d-flex">
                        <input id="field_fecEvent" type="datetime-local" class="form-control" name="fecEvent" [(ngModel)]="fecEvent"
                        required/>
                    </div>
                    <div [hidden]="!(editForm.controls.fecEvent?.dirty && editForm.controls.fecEvent?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.fecEvent?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.fecEvent?.errors?.ZonedDateTimelocal" jhiTranslate="entity.validation.ZonedDateTimelocal">
                            This field should be a date and time.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.codCliente" for="field_codCliente" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.codCliente' | translate">Cod Cliente</label>
                    <input type="text" class="form-control" name="codCliente" id="field_codCliente"
                        [(ngModel)]="desgloseMensaje.codCliente" required/>
                    <div [hidden]="!(editForm.controls.codCliente?.dirty && editForm.controls.codCliente?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codCliente?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.codTipoDes" for="field_codTipoDes" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.codTipoDes' | translate">Cod Tipo Des</label>
                    <input type="number" class="form-control" name="codTipoDes" id="field_codTipoDes"
                        [(ngModel)]="desgloseMensaje.codTipoDes" required/>
                    <div [hidden]="!(editForm.controls.codTipoDes?.dirty && editForm.controls.codTipoDes?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codTipoDes?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.codTipoDes?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.codSubtipoDes" for="field_codSubtipoDes" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.codSubtipoDes' | translate">Cod Subtipo Des</label>
                    <input type="number" class="form-control" name="codSubtipoDes" id="field_codSubtipoDes"
                        [(ngModel)]="desgloseMensaje.codSubtipoDes" required/>
                    <div [hidden]="!(editForm.controls.codSubtipoDes?.dirty && editForm.controls.codSubtipoDes?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codSubtipoDes?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.codSubtipoDes?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.codMoneda" for="field_codMoneda" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.codMoneda' | translate">Cod Moneda</label>
                    <input type="text" class="form-control" name="codMoneda" id="field_codMoneda"
                        [(ngModel)]="desgloseMensaje.codMoneda" required/>
                    <div [hidden]="!(editForm.controls.codMoneda?.dirty && editForm.controls.codMoneda?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codMoneda?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.numRolEmpleado" for="field_numRolEmpleado" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.numRolEmpleado' | translate">Num Rol Empleado</label>
                    <input type="text" class="form-control" name="numRolEmpleado" id="field_numRolEmpleado"
                        [(ngModel)]="desgloseMensaje.numRolEmpleado" required/>
                    <div [hidden]="!(editForm.controls.numRolEmpleado?.dirty && editForm.controls.numRolEmpleado?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.numRolEmpleado?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseMensaje.glsComentarios" for="field_glsComentarios" [ngbTooltip]="'desgloseApp.desgloseMensaje.help.glsComentarios' | translate">Gls Comentarios</label>
                    <input type="text" class="form-control" name="glsComentarios" id="field_glsComentarios"
                        [(ngModel)]="desgloseMensaje.glsComentarios" />
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
