<div class="modal-header">
    <h4 class="modal-title"><span jhiTranslate="breakdown.buttonClone.title"></span></h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            (click)="closeModal()">&times;
    </button>
</div>
<div class="modal-body">
    <jhi-alert></jhi-alert>
    <jhi-alert-error></jhi-alert-error>
    <div class="row justify-content-center">
        <div class="col-12">
            <form name="breakdownDataCloneForm" role="form" novalidate #breakdownDataCloneForm="ngForm" id="breakdownDataCloneForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label class="form-control-label" jhiTranslate="breakdown.breakdownType" for="field_breakdownType"></label>
                        <select class="form-control form-control-sm" id="field_breakdownType" name="breakdownType" [(ngModel)]="codTipoDes">
                            <option [ngValue]="el.codGenerico" *ngFor="let el of (simpleComboBoxTypes | filterDescripcionCodigo:CODTABLA_TIPO_DESGLOSE)">
                                {{el.glsGenericalarga }}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label class="form-control-label" jhiTranslate="breakdown.breakdownSubType" for="field_breakdownSubType"></label>
                        <select class="form-control form-control-sm" id="field_breakdownSubType" name="breakdownSubType" [(ngModel)]="codSubtipoDes" #fieldBreakdownSubType
                                (change)="onBreakdownSubTypeChange()">
                            <option [ngValue]="el.codGenerico" *ngFor="let el of (simpleComboBoxTypes | filterDescripcionCodigo:CODTABLA_SUBTIPO_DESGLOSE)">
                                {{el.glsGenericalarga}}
                            </option>
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label class="form-control-label" for="field_breakdownSubTypeDesc">&nbsp;</label>
                        <input type="text" class="form-control form-control-sm" name="breakdownSubTypeDesc" id="field_breakdownSubTypeDesc" [(ngModel)]="glsSubtipoDes"
                               #fieldBreakdownSubTypeDesc/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label class="form-control-label" jhiTranslate="global.form.currency" for="field_currency"></label>
                        <select class="form-control form-control-sm" id="field_currency" name="currency" [(ngModel)]="codMoneda"
                                (change)="onBreakdownCurrencyChange()" #fieldBreakdownCurrency>
                            <option [ngValue]="el.codGenerico" *ngFor="let el of (simpleComboBoxTypes | filterDescripcionCodigo:CODTABLA_TIPO_MONEDAS)">
                                {{el.glsGenericalarga }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group col-md-1">
                        <label class="form-control-label">&nbsp;</label>
                        <button style="min-width: 20px; padding: 0.375rem 1.25rem;" [class]="'btn btn-' + state.stateClass + ' btn-block btn-custom-font-size col-md-6'"></button>
                        <!--<span class="badge badge-primary" style="min-width: 20px; padding: 0.375rem 0.75rem;"></span>-->
                    </div>
                    <div class="form-group col-md-2">
                        <label class="form-control-label" for="field_firstState">&nbsp;</label>
                        <input style="padding-left: 15px; width: auto; height: 35px;" type="text" readonly class="form-control-plaintext form-control-sm text-uppercase"
                               name="firstState" id="field_firstState" [(ngModel)]="state.state"/>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-sm-6"></div>
                    <div class="col-sm-3" style="padding-left: 5px;">
                        <button class="btn btn-default btn-block btn-custom-font-size-1" (click)="onClickCancel()">
                            <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="global.form.cancel"></span>
                        </button>
                    </div>
                    <div class="col-sm-3">
                        <button type="button" class="btn btn-primary btn-block btn-custom-font-size-1" (click)="triggerOnSelectItemEvent()" [disabled]="existBreakdown">
                            <fa-icon [icon]="'check'"></fa-icon>&nbsp;<span jhiTranslate="global.form.accept"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
