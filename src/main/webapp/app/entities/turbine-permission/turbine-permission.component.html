<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.turbinePermission.home.title">Turbine Permissions</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-turbine-permission" [routerLink]="['/turbine-permission/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="desgloseApp.turbinePermission.home.createLabel">
            Create new Turbine Permission
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="turbinePermissions">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="permissionId"><span jhiTranslate="desgloseApp.turbinePermission.permissionId">Permission Id</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="permissionName"><span jhiTranslate="desgloseApp.turbinePermission.permissionName">Permission Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="objectdata"><span jhiTranslate="desgloseApp.turbinePermission.objectdata">Objectdata</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let turbinePermission of turbinePermissions ;trackBy: trackId">
                <td><a [routerLink]="['/turbine-permission', turbinePermission.id, 'view' ]">{{turbinePermission.id}}</a></td>
                <td>{{turbinePermission.permissionId}}</td>
                <td>{{turbinePermission.permissionName}}</td>
                <td>
                    <a *ngIf="turbinePermission.objectdata" (click)="openFile(turbinePermission.objectdataContentType, turbinePermission.objectdata)" jhiTranslate="entity.action.open">open</a>
                    <span *ngIf="turbinePermission.objectdata">{{turbinePermission.objectdataContentType}}, {{byteSize(turbinePermission.objectdata)}}</span>
                </td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/turbine-permission', turbinePermission.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/turbine-permission', turbinePermission.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'turbine-permission/'+ turbinePermission.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="turbinePermissions && turbinePermissions.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
