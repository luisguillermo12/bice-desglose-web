<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-desglose-firma-heading" jhiTranslate="desgloseApp.desgloseFirma.home.createOrEditLabel">Create or edit a Desglose Firma</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!desgloseFirma.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="desgloseFirma.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseFirma.codCargo" for="field_codCargo" [ngbTooltip]="'desgloseApp.desgloseFirma.help.codCargo' | translate">Cod Cargo</label>
                    <input type="text" class="form-control" name="codCargo" id="field_codCargo"
                        [(ngModel)]="desgloseFirma.codCargo" required/>
                    <div [hidden]="!(editForm.controls.codCargo?.dirty && editForm.controls.codCargo?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codCargo?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseFirma.numRolEmpleado" for="field_numRolEmpleado" [ngbTooltip]="'desgloseApp.desgloseFirma.help.numRolEmpleado' | translate">Num Rol Empleado</label>
                    <input type="text" class="form-control" name="numRolEmpleado" id="field_numRolEmpleado"
                        [(ngModel)]="desgloseFirma.numRolEmpleado" required/>
                    <div [hidden]="!(editForm.controls.numRolEmpleado?.dirty && editForm.controls.numRolEmpleado?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.numRolEmpleado?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.desgloseFirma.numRolEmpleado2fir" for="field_numRolEmpleado2fir" [ngbTooltip]="'desgloseApp.desgloseFirma.help.numRolEmpleado2fir' | translate">Num Rol Empleado 2 Fir</label>
                    <input type="text" class="form-control" name="numRolEmpleado2fir" id="field_numRolEmpleado2fir"
                        [(ngModel)]="desgloseFirma.numRolEmpleado2fir" required/>
                    <div [hidden]="!(editForm.controls.numRolEmpleado2fir?.dirty && editForm.controls.numRolEmpleado2fir?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.numRolEmpleado2fir?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
