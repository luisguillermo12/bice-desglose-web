<div class="modal-header">
    <h4 class="modal-title"><span jhiTranslate="breakdown.consolidated.title"></span></h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            (click)="closeModal()">&times;
    </button>
</div>
<div class="modal-body">
    <jhi-alert-error></jhi-alert-error>
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="form-group row">
                <div class="col-sm-12">
                    <hot-table
                        [licenseKey]="HANDS_ON_TABLE_LICENSE_KEY"
                        [data]="data"
                        [colHeaders]="colHeaders"
                        [colWidths]="colWidths"
                        [columns]="columns"
                        [settings]="options"
                        [afterInit]="afterInitConsolidateCompanies">
                    </hot-table>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-1">
                    <button class="btn btn-primary btn-block btn-custom-font-size-1" (click)="onClickNewRow()">
                        <fa-icon [icon]="'plus'"></fa-icon>&nbsp;
                    </button>
                </div>
                <div class="col-sm-7"></div>
                <div class="col-sm-2">
                    <button class="btn btn-default btn-block btn-custom-font-size-1" (click)="onClickCancel()">
                        <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="global.form.cancel"></span>
                    </button>
                </div>
                <div class="col-sm-2">
                    <button class="btn btn-primary btn-block btn-custom-font-size-1" (click)="onClickSaveConsolidatedCompanies()" [disabled]="!isFormDataValid">
                        <fa-icon [icon]="'check'"></fa-icon>&nbsp;<span jhiTranslate="global.form.accept"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
