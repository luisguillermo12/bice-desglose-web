<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.turbineRole.home.title">Turbine Roles</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-turbine-role" [routerLink]="['/turbine-role/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span jhiTranslate="desgloseApp.turbineRole.home.createLabel">
            Create new Turbine Role
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="turbineRoles">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
                <th jhiSortBy="roleId"><span jhiTranslate="desgloseApp.turbineRole.roleId">Role Id</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="roleName"><span jhiTranslate="desgloseApp.turbineRole.roleName">Role Name</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th jhiSortBy="objectdata"><span jhiTranslate="desgloseApp.turbineRole.objectdata">Objectdata</span>
                    <fa-icon [icon]="'sort'"></fa-icon>
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let turbineRole of turbineRoles ;trackBy: trackId">
                <td><a [routerLink]="['/turbine-role', turbineRole.roleId, 'view' ]">{{turbineRole.roleId}}</a></td>
                <td>{{turbineRole.roleName}}</td>
                <td>
                    <a *ngIf="turbineRole.objectdata" (click)="openFile(turbineRole.objectdataContentType, turbineRole.objectdata)" jhiTranslate="entity.action.open">open</a>
                    <span *ngIf="turbineRole.objectdata">{{turbineRole.objectdataContentType}}, {{byteSize(turbineRole.objectdata)}}</span>
                </td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit" [routerLink]="['/turbine-role', turbineRole.roleId, 'view' ]" class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit" [routerLink]="['/turbine-role', turbineRole.roleId, 'edit']" class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit" [routerLink]="['/', { outlets: { popup: 'turbine-role/'+ turbineRole.roleId + '/delete'} }]" replaceUrl="true"
                                queryParamsHandling="merge" class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="turbineRoles && turbineRoles.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true"
                            (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
