<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.tablaServMailDest.home.title">Tabla Serv Mail Dests</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-tabla-serv-mail-dest" [routerLink]="['/tabla-serv-mail-dest/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="desgloseApp.tablaServMailDest.home.createLabel">
            Create new Tabla Serv Mail Dest
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="tablaServMailDests">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="codSistema"><span jhiTranslate="desgloseApp.tablaServMailDest.codSistema">Cod Sistema</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="numSolicitud"><span jhiTranslate="desgloseApp.tablaServMailDest.numSolicitud">Num Solicitud</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="glsToNombre"><span jhiTranslate="desgloseApp.tablaServMailDest.glsToNombre">Gls To Nombre</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="glsToMail"><span jhiTranslate="desgloseApp.tablaServMailDest.glsToMail">Gls To Mail</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="codTipoDest"><span jhiTranslate="desgloseApp.tablaServMailDest.codTipoDest">Cod Tipo Dest</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let tablaServMailDest of tablaServMailDests ;trackBy: trackId">
                <td><a [routerLink]="['/tabla-serv-mail-dest', tablaServMailDest.id, 'view' ]">{{tablaServMailDest.id}}</a></td>
                <td>{{tablaServMailDest.codSistema}}</td>
                <td>{{tablaServMailDest.numSolicitud}}</td>
                <td>{{tablaServMailDest.glsToNombre}}</td>
                <td>{{tablaServMailDest.glsToMail}}</td>
                <td>{{tablaServMailDest.codTipoDest}}</td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/tabla-serv-mail-dest', tablaServMailDest.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/tabla-serv-mail-dest', tablaServMailDest.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'tabla-serv-mail-dest/'+ tablaServMailDest.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="tablaServMailDests && tablaServMailDests.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
