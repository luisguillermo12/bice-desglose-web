<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-tabla-serv-mail-dest-heading" jhiTranslate="desgloseApp.tablaServMailDest.home.createOrEditLabel">Create or edit a Tabla Serv Mail Dest</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!tablaServMailDest.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="tablaServMailDest.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.tablaServMailDest.codSistema" for="field_codSistema" [ngbTooltip]="'desgloseApp.tablaServMailDest.help.codSistema' | translate">Cod Sistema</label>
                    <input type="text" class="form-control" name="codSistema" id="field_codSistema"
                        [(ngModel)]="tablaServMailDest.codSistema" required/>
                    <div [hidden]="!(editForm.controls.codSistema?.dirty && editForm.controls.codSistema?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codSistema?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.tablaServMailDest.numSolicitud" for="field_numSolicitud" [ngbTooltip]="'desgloseApp.tablaServMailDest.help.numSolicitud' | translate">Num Solicitud</label>
                    <input type="number" class="form-control" name="numSolicitud" id="field_numSolicitud"
                        [(ngModel)]="tablaServMailDest.numSolicitud" required/>
                    <div [hidden]="!(editForm.controls.numSolicitud?.dirty && editForm.controls.numSolicitud?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.numSolicitud?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.controls.numSolicitud?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.tablaServMailDest.glsToNombre" for="field_glsToNombre" [ngbTooltip]="'desgloseApp.tablaServMailDest.help.glsToNombre' | translate">Gls To Nombre</label>
                    <input type="text" class="form-control" name="glsToNombre" id="field_glsToNombre"
                        [(ngModel)]="tablaServMailDest.glsToNombre" required/>
                    <div [hidden]="!(editForm.controls.glsToNombre?.dirty && editForm.controls.glsToNombre?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.glsToNombre?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.tablaServMailDest.glsToMail" for="field_glsToMail" [ngbTooltip]="'desgloseApp.tablaServMailDest.help.glsToMail' | translate">Gls To Mail</label>
                    <input type="text" class="form-control" name="glsToMail" id="field_glsToMail"
                        [(ngModel)]="tablaServMailDest.glsToMail" required/>
                    <div [hidden]="!(editForm.controls.glsToMail?.dirty && editForm.controls.glsToMail?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.glsToMail?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="desgloseApp.tablaServMailDest.codTipoDest" for="field_codTipoDest" [ngbTooltip]="'desgloseApp.tablaServMailDest.help.codTipoDest' | translate">Cod Tipo Dest</label>
                    <input type="text" class="form-control" name="codTipoDest" id="field_codTipoDest"
                        [(ngModel)]="tablaServMailDest.codTipoDest" required/>
                    <div [hidden]="!(editForm.controls.codTipoDest?.dirty && editForm.controls.codTipoDest?.invalid)">
                        <small class="form-text text-danger"
                        [hidden]="!editForm.controls.codTipoDest?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
