<div>
    <h2 id="page-heading">
        <span jhiTranslate="desgloseApp.desgloseGrupo.home.title">Desglose Grupos</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-desglose-grupo" [routerLink]="['/desglose-grupo/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="desgloseApp.desgloseGrupo.home.createLabel">
            Create new Desglose Grupo
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="desgloseGrupos">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="codCargo"><span jhiTranslate="desgloseApp.desgloseGrupo.codCargo">Cod Cargo</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="numRolEmpleado"><span jhiTranslate="desgloseApp.desgloseGrupo.numRolEmpleado">Num Rol Empleado</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="desCodCargo"><span jhiTranslate="desgloseApp.desgloseGrupo.desCodCargo">Des Cod Cargo</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="desNumRolEmpleado"><span jhiTranslate="desgloseApp.desgloseGrupo.desNumRolEmpleado">Des Num Rol Empleado</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let desgloseGrupo of desgloseGrupos ;trackBy: trackId">
                <td><a [routerLink]="['/desglose-grupo', desgloseGrupo.id, 'view' ]">{{desgloseGrupo.id}}</a></td>
                <td>{{desgloseGrupo.codCargo}}</td>
                <td>{{desgloseGrupo.numRolEmpleado}}</td>
                <td>{{desgloseGrupo.desCodCargo}}</td>
                <td>{{desgloseGrupo.desNumRolEmpleado}}</td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/desglose-grupo', desgloseGrupo.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/desglose-grupo', desgloseGrupo.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', { outlets: { popup: 'desglose-grupo/'+ desgloseGrupo.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="desgloseGrupos && desgloseGrupos.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="queryCount" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
