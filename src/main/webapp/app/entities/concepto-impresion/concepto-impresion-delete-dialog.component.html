<form name="deleteForm"
      (ngSubmit)="confirmDelete(conceptoImpresion.codCliente, conceptoImpresion.codTipoDes, conceptoImpresion.codSubtipoDes, conceptoImpresion.codMoneda,
      conceptoImpresion.codTipoConcep, conceptoImpresion.corConcepto)">
    <div class="modal-header">
        <h4 class="modal-title" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                (click)="clear()">&times;
        </button>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <p id="jhi-delete-conceptoImpresion-heading" jhiTranslate="desgloseApp.conceptoImpresion.delete.question"
           translateValues="{id: 'codCliente={{conceptoImpresion.codCliente}}, codTipoDes={{conceptoImpresion.codTipoDes}}, codSubtipoDes={{conceptoImpresion.codSubtipoDes}}, codMoneda={{conceptoImpresion.codMoneda}}, codTipoConcep={{conceptoImpresion.codTipoConcep}}, corConcepto={{conceptoImpresion.corConcepto}}'}">
            Are you sure you want to delete this Concepto Impresion?</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="clear()">
            <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>
        <button id="jhi-confirm-delete-conceptoImpresion" type="submit" class="btn btn-danger">
            <fa-icon [icon]="'times'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
        </button>
    </div>
</form>
